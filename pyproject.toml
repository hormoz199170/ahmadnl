[project]
name = "ahmadnl"
version = "0.1.0"
description = "Telegram PDF reading assistant"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.0,<4.0",
  "SQLAlchemy>=2.0,<3.0",
  "pydantic-settings>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "PyMuPDF>=1.24,<2.0",
  "google-generativeai>=0.7,<1.0",
  "alembic>=1.13,<2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "aiosqlite>=0.19"]

[project.scripts]
ahmadnl-bot = "ahmadnl.bot.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
